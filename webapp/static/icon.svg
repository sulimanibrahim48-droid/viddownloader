<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0728" />
    </linearGradient>
    
    <!-- Neon Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner border glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.3" />

  <g transform="translate(0, 0)">
    <!-- Decorative playlist lines -->
    <path d="M140 180h232M140 256h232M140 332h232" stroke="#8b5cf6" stroke-width="12" stroke-linecap="round" opacity="0.15" />
    
    <!-- Large Film Frame / Card in center -->
    <rect x="166" y="146" width="180" height="220" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="12" filter="url(#neonGlow)" />
    
    <!-- Play Triangle -->
    <polygon points="236,220 236,292 296,256" fill="url(#accentGrad)" filter="url(#neonGlow)" />
    
    <!-- Stitching connection nodes -->
    <circle cx="166" cy="256" r="16" fill="none" stroke="#ec4899" stroke-width="8" />
    <circle cx="346" cy="256" r="16" fill="none" stroke="#3b82f6" stroke-width="8" />
    <line x1="182" y1="256" x2="330" y2="256" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="10 6" />
  </g>
</svg>
